name: Claude PR Gate (Codex review + Gauntlet visual verify + deploy)
# Codex review runs on EVERY non-draft PR (Justin, 2026-08-29: "make sure codex
# reviews" — bot PRs 425/426 merged with no reviewable evidence). The job below
# is a REQUIRED status check on main: no APPROVE, no merge, no exceptions.
# The auto-fix loop, gauntlet visual verify, and auto-merge stay gated on the
# claude-fix label exactly as before.
#
# Auth: subscriptions only, no API keys.
# - Claude: CLAUDE_CODE_OAUTH_TOKEN secret (needs id-token: write below)
# - Codex: CODEX_AUTH_JSON secret (contents of ~/.codex/auth.json)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  codex-review:
    name: Codex Review Gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: codex-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Codex auth (ChatGPT Pro subscription — no API key)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json

      - name: Codex adversarial review
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          # Prior rounds: earlier gate verdicts AND the author's replies (fixes,
          # disputes). Without this the reviewer is stateless — PR #453 (2026-09-03)
          # went four rounds, each raising new items and one reversing its own
          # earlier request, because every run re-read the diff from scratch.
          gh pr view ${{ github.event.pull_request.number }} --json comments \
            -q '.comments[] | "--- " + .author.login + " (" + .createdAt + ")\n" + .body + "\n"' \
            > /tmp/prior.txt || true
          # effort high, not xhigh: xhigh blew the review budget on ~40KB diffs
          # (same finding as the fleet's review_chain.py, 2026-08-28)
          codex exec \
            --model gpt-5.6-sol \
            -c model_reasoning_effort="high" \
            --sandbox read-only \
            "You are a rigorous but fair code reviewer acting as a merge gate. Review
             the diff in /tmp/pr.diff against the PR intent below. Look for bugs,
             security issues, missed edge cases, and incomplete fixes.

             /tmp/prior.txt holds the earlier rounds on this PR: your previous
             verdicts and the author's replies. Rules for converging:
             - An item the author marked fixed: verify it in the diff; do not restate it.
             - An item the author disputed with a rationale: accept it unless the
               rationale is factually wrong, and say why if you reject it.
             - Do not raise a new item in a later round that the earlier rounds could
               have raised on the same code, unless it is a P0/P1 defect.
             - Do not reverse a position you took in an earlier round without
               explicitly acknowledging it.
             - Missing tests, style, and refactoring suggestions are advisory, never
               grounds for REQUEST_CHANGES.
             - APPROVE when no P0/P1 defect (data loss, wrong money, auth bypass,
               security, broken core flow) remains. List advisory notes under a
               heading 'Non-blocking'.

             End your output with exactly one line:
             VERDICT: APPROVE  or  VERDICT: REQUEST_CHANGES followed by a numbered
             list of required changes, each tagged P0 or P1 with the failure scenario.

             PR title: ${{ github.event.pull_request.title }}
             PR body: $(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)" \
            | tee /tmp/review.txt
          VERDICT=$(grep -oE 'VERDICT: (APPROVE|REQUEST_CHANGES)' /tmp/review.txt | tail -1)
          echo "verdict=${VERDICT#VERDICT: }" >> "$GITHUB_OUTPUT"
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.txt
        # Comment always posts; the gate is enforced below.

      - name: Fail gate if changes requested
        if: steps.review.outputs.verdict != 'APPROVE'
        run: |
          echo "Codex did not APPROVE. Read its newest PR comment, address every"
          echo "numbered item (or dispute it in a reply), push, and this gate re-runs."
          exit 1

  fix-review-feedback:
    needs: codex-review
    if: failure() && contains(github.event.pull_request.labels.*.name, 'claude-fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Claude addresses Codex review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Codex reviewed this PR and requested changes (see the newest PR comment
            containing "VERDICT: REQUEST_CHANGES" — read it with
            gh pr view ${{ github.event.pull_request.number }} --comments).
            Address every numbered item, re-run tests, commit and push to this branch.
            If you believe an item is wrong, explain why in a PR comment instead of
            changing code, and mark it as disputed.
          claude_args: |
            --model claude-opus-5
            --effort medium
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Read,Edit,Write,Grep,Glob,Task"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gauntlet-visual-verify:
    needs: codex-review
    if: needs.codex-review.outputs.verdict == 'APPROVE' && contains(github.event.pull_request.labels.*.name, 'claude-fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel preview deployment
        id: preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Gauntlet visual verification (Claude + Playwright)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /gauntlet-verify
            Preview URL: ${{ steps.preview.outputs.url }}
            PR number: ${{ github.event.pull_request.number }}
            The PR body contains the "Visual acceptance criteria" — verify EVERY
            criterion in a real browser per the gauntlet-verify skill. The fix must
            be verified 100% or the gate fails.
          claude_args: |
            --model claude-opus-5
            --effort medium
            --allowedTools "Bash(npx:*),Bash(npm:*),Bash(node:*),Bash(gh:*),Read,Write,Edit,Grep,Glob,Task"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth for visual verification WITHOUT automating Google OAuth —
          # see .claude/skills/gauntlet-verify/SKILL.md (PIN/NextAuth path).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  merge-and-deploy:
    needs: [codex-review, gauntlet-visual-verify]
    if: needs.codex-review.outputs.verdict == 'APPROVE' && contains(github.event.pull_request.labels.*.name, 'claude-fix')
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge (production deploy happens via Vercel Git integration)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --auto --repo ${{ github.repository }}

      # Optional: apply Supabase migrations on merge to main.
      # - name: Apply Supabase migrations
      #   run: |
      #     npx supabase link --project-ref $PROJECT_REF
      #     npx supabase db push

      - name: Notify (optional Google Chat webhook)
        if: always()
        continue-on-error: true
        env:
          CHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          [ -z "$CHAT_WEBHOOK" ] && exit 0
          curl -s -X POST "$CHAT_WEBHOOK" -H 'Content-Type: application/json' \
            -d "{\"text\": \"✅ Auto-fix PR #${{ github.event.pull_request.number }} passed Codex review + visual gauntlet and is merging: ${{ github.event.pull_request.html_url }}\"}"
