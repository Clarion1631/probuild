name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview URL to audit
        required: true
        default: https://probuild.goldentouchremodeling.com

concurrency:
  group: ${{ github.workflow }}-${{ inputs.base_url || github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse on production
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ inputs.base_url }}
            ${{ inputs.base_url }}/login
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
