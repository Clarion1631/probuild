name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Proves that prisma/migrations/ still reproduces PRODUCTION's schema. Before
  # the 2026-08-14 baseline, prisma/migrations/ and prod's _prisma_migrations had
  # no common ancestor at all: the folder held one never-applied 3-line file, and
  # nothing in CI or the deploy path ever ran `migrate deploy`, so a database
  # built from the committed migrations bore no relation to prod.
  #
  # Runs against a throwaway Postgres service container — NEVER the live DB.
  migrations:
    name: Migrations reproduce production
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: probuild
          POSTGRES_PASSWORD: probuild
          POSTGRES_DB: probuild_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
      DIRECT_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # `npm ci`, not `npm install`: this job's whole purpose is byte-level
      # reproducibility, so the toolchain that renders DDL has to come from the
      # lockfile rather than being free to resolve a different engine build.
      - run: npm ci

      # Executes the baseline for real. Nothing had ever run this SQL before it
      # was committed, so this step alone is the difference between a baseline
      # that is known-good and one that merely looks right.
      - name: Apply committed migrations to the throwaway database
        run: npx prisma migrate deploy

      # The schema gap the baseline recorded is now closed by
      # 20260814120000_missing_fk_indexes, so `migrate deploy` above already
      # produces the final shape and there is no separate gap file to apply.
      # prisma/EXPECTED_SCHEMA_GAP.sql was deleted with that migration; an
      # absent gap file means the only remaining diff is PRISMA_PHANTOM_DIFF.sql.
      - name: Assert the result matches production's shape
        run: node scripts/check-migrations-match.mjs

      # The APPLY SCRIPT itself, run the way a human runs it before a deploy.
      #
      # `migrate deploy` above proves the committed SQL; it never runs
      # scripts/apply-qb-sync-marker.mjs, and `main()` is the one part of that
      # file no unit test executes — a verify-pass bug in the information_schema
      # read that is supposed to prove the columns landed would sail through
      # every other check in this repo. The driver builds a PRE-marker database,
      # runs the script from scratch, runs it again for idempotency, and asserts
      # the resulting shape matches the committed migration.
      #
      # Its own database, created and dropped by the driver, so it cannot
      # disturb the schema the steps above and below assert on.
      - name: Apply script end-to-end against real Postgres
        run: node scripts/ci-apply-qb-sync-marker-e2e.mjs
        env:
          APPLY_E2E_SERVER_URL: postgresql://probuild:probuild@localhost:5432/postgres
          APPLY_E2E_DB: probuild_apply_qb_sync_marker
      # Real two-transaction concurrency, against the throwaway database this
      # job already built. It must run BEFORE the blind-spot test below, which
      # deliberately drifts the schema's functions and triggers at the end.
      - name: Prove the money-path Client row lock actually blocks
        run: npx tsx --test tests/qbo-client-lock-db.test.ts
        env:
          QBO_CLIENT_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      - name: Verify one-record bank image repair transaction
        run: npx tsx --test tests/bank-image-1027-repair-db.test.ts
        env:
          BANK_IMAGE_REPAIR_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      - name: Verify time-entry migration CLI targets against disposable Postgres
        run: |
          node scripts/apply-clock-in-integrity.mjs --target ci
          node scripts/apply-time-entry-void.mjs --target ci
        env:
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      - name: Verify clock-in uniqueness and request replay against Postgres
        run: npx tsx --test tests/clock-in-integrity.test.ts tests/clock-in-integrity-db.test.ts
        env:
          CLOCK_IN_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      - name: Verify audited void source preservation and payroll billing meal races
        run: npx tsx --test tests/time-entry-void.test.ts tests/time-entry-void-db.test.ts
        env:
          TIME_ENTRY_VOID_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # The gap-file steps that sat here are gone with the file: this branch's
      # migration closes the recorded gap, so `migrate deploy` now reproduces
      # production's shape directly and the assertion above is the whole check.
      #
      # The focused integration regression deliberately drifts the disposable
      # database's function and trigger after proving the checker recognizes
      # the production snapshot. It therefore runs last in this job.
      # The receipt-intake claim transaction against a REAL Postgres. The rest
      # of that feature's suites mock every DB call, so the SQL — a void
      # function read through $queryRaw, a claim that behaves differently than
      # its mock — is the one part they cannot see.
      - name: Receipt-intake claim + advisory locks against real Postgres
        run: npx tsx --test tests/receipt-intake-claim-db.test.ts
        env:
          RECEIPT_INTAKE_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # The phase invariant's PHANTOM hole. Everything else in that suite runs
      # against a scripted fake, which has no lock manager and so cannot tell a
      # verdict that holds its rows from one that merely read them.
      - name: Phase-invariant proof-query lock against real Postgres
        run: npx tsx --test tests/phase-invariant-db.test.ts
        env:
          PHASE_INVARIANT_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # The deploy bridge's TRIGGERS. Every other test of them reads the SQL as
      # text; only a real server can say whether a BEFORE UPDATE trigger
      # actually keeps an old writer's amount change from leaving a stale tax
      # classification — or from failing the CHECK constraints outright.
      - name: Expense attribution compatibility triggers against real Postgres
        run: npx tsx --test tests/expense-attribution-triggers-db.test.ts
        env:
          PHASE_INVARIANT_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # The Project/Estimate acquisition order, both ways round. Carries its own
      # pre-fix CONTROL: the old Estimate-then-Project sequence really does
      # raise 40P01 against a Project-first editor, so the tests that follow are
      # measuring the fix rather than an interleaving that never collided.
      - name: Attribution lock order against real Postgres
        run: npx tsx --test tests/attribution-lock-order-db.test.ts
        env:
          PHASE_INVARIANT_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # THE MIXED-VERSION DRAIN WINDOW. An old instance's INSERT is raw SQL that
      # names neither new column -- a shape today's Prisma client cannot express --
      # and the fix is a trigger that stamps it and takes the route's advisory lock.
      # Neither half exists outside a real server.
      - name: Receipt-ingest drain-window bridge against real Postgres
        run: npx tsx --test tests/receipt-ingest-drain-window-db.test.ts
        env:
          PHASE_INVARIANT_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # The backfill's coverage headline against the report it claims to describe,
      # on one seeded database. A hand-built fixture cannot catch the two readers
      # drifting apart, because the fixture is written by whoever wrote the code.
      - name: Backfill coverage parity with the variance report
        run: npx tsx --test tests/backfill-coverage-parity-db.test.ts
        env:
          PHASE_INVARIANT_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # An index can EXIST and enforce nothing. A failed CREATE INDEX
      # CONCURRENTLY leaves the index behind with the right name and
      # `indisvalid = false`; the planner ignores it, a UNIQUE one guards
      # nothing, and `IF NOT EXISTS` then matches the name forever. Only a real
      # server can produce that state, so only a real server can prove the
      # verifier notices it and rebuilds it.
      - name: Apply-script index validity against real Postgres
        run: npx tsx --test tests/apply-script-index-db.test.ts
        env:
          PHASE_INVARIANT_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # The excise deduction's FILTER, against the real planner. A relation
      # filter like `{ estimate: { projectId: null } }` compiles to an EXISTS,
      # so it silently excludes rows with no estimate at all -- the shape
      # ON DELETE SET NULL creates. Only a real database can answer that.
      - name: Tax-at-source report filter against real Postgres
        run: npx tsx --test tests/tax-at-source-report-db.test.ts
        env:
          PHASE_INVARIANT_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # THE APPLY SCRIPT, RUN FOR REAL (round 46, item 0).
      #
      # Every other test in this repo imports the script's CONSTANTS and checks
      # their text. `main()` -- the part that connects, runs the phases and
      # VERIFIES the result -- had never executed in CI, and it was broken: the
      # CHECK-constraint comparison used regexes that do not match Postgres 16's
      # rendering, so the script exited 1 on a database it had just built
      # correctly. A deploy blocker no amount of source-text testing could see.
      #
      # The driver builds a PRE-PHASE-3 database (the phase-3 migration is moved
      # aside), so this is a genuine from-scratch apply, then runs pre-deploy,
      # post-deploy, and pre-deploy again for idempotency.
      - name: Apply script end-to-end against real Postgres
        run: node scripts/ci-apply-expense-attribution-e2e.mjs
        env:
          APPLY_E2E_SERVER_URL: postgresql://probuild:probuild@localhost:5432/postgres
          APPLY_E2E_DB: probuild_apply

      # The missing-receipt sweep's component transaction, at the isolation it
      # actually runs at. Postgres SSI is the whole fence for evidence writers
      # this PR does not own (a ReceiptIntake insert, an Expense receipt
      # update), so it can only be asserted against a real database.
      - name: Receipt evidence fence holds against real Postgres
        run: npx tsx --test tests/receipt-evidence-fence-db.test.ts
        env:
          RECEIPT_INTAKE_DB_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # THE APPLY SCRIPT ITSELF, run end to end the way production will run it.
      # Its exported helpers are unit-tested and its statement list is replayed
      # by the DB-gated suite, but main() is executed by nothing else: not the
      # flag parsing, not the identity gate, not the statements running in order
      # against a real server, not the second run being a genuine no-op. It
      # builds two databases -- one pre-Phase-1, and one carrying the OLD
      # Phase-1 table with DEFAULT 'RECEIVED' so the additive upgrade and the
      # state-default repair are exercised -- and asserts both end up matching
      # what the committed migration produces.
      #
      # `--target ci` inside the driver: the ambient URL, no production baseline
      # or project-ref check, and a refusal if that URL looks like Supabase.
      - name: Apply script end-to-end against real Postgres
        run: node scripts/ci-apply-receipt-intake-e2e.mjs
        env:
          APPLY_E2E_SERVER_URL: postgresql://probuild:probuild@localhost:5432/postgres
          APPLY_E2E_DB: probuild_apply_fresh
      # Two REAL connections contending on a User row. Every other concurrency
      # proof in the suite is an injected sequence, which shows the branch exists
      # but not that PostgreSQL serializes the way the code assumes. Runs BEFORE
      # the drift test below, which deliberately mutates this database.
      # Production received this migration on 2026-09-02, so the documented
      # deploy command must be a safe no-op against an already-applied database
      # and --dry-run must execute nothing. Proven here, never against prod.
      # Mutation tests for the VERIFIER: break one thing at a time (RLS off, a
      # policy added, wrong index columns, a weakened CHECK, an FK back to
      # CASCADE, a decoy in another schema, a lost NOT NULL) and assert each is
      # reported. A verifier that cannot fail is not a verifier.
      - name: Prove the schema-drift verifier reports each kind of drift
        run: npx tsx --test tests/payroll-schema-drift-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # Concurrent reassignment of a time entry, on two real connections.
      - name: Prove a reassigned time entry is refused by the conditional writes
        run: npx tsx --test tests/time-entry-reassign-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Imports the app's prisma singleton via wa-breaks-db — see the note
          # on the rate-lock step below.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # The change-order tag racing a logistics reroute, both orders, on real
      # connections. tests/time-expense-core-guards.test.ts pins the SHAPE of
      # that fix from the source; only this step shows PostgreSQL actually
      # serializes the two the way the code assumes, and that a refused tag
      # leaves nothing behind.
      - name: Prove the change-order tag and a logistics reroute cannot both win
        run: npx tsx --test tests/change-order-tag-race-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Runs the real tagTimeEntriesToChangeOrderCore, which reaches the
          # app's prisma singleton — see the note on the rate-lock step below.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # The $0-rate guard through the real create core, then the ROW read back:
      # the regression it replaced was a completed, unflagged, $0 TimeEntry row,
      # which no predicate test can see.
      - name: Prove the $0-rate guard refuses, flags and exempts the right rows
        run: npx tsx --test tests/zero-rate-create-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      - name: Prove the apply script is idempotent and --dry-run is read-only
        run: npx tsx --test tests/payroll-apply-idempotent-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      - name: Prove settlement's FOR SHARE blocks a concurrent rate write
        run: npx tsx --test tests/payroll-rate-lock-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # This test imports the app's prisma singleton, which REFUSES a
          # DATABASE_URL without pgbouncer=true. That guard is production safety,
          # not a nuisance: without the flag the Supabase transaction pooler
          # returns 42P05 "prepared statement already exists" and the site goes
          # down (CLAUDE.md). It is satisfied here rather than weakened — the
          # same thing the Playwright job below already does for its own
          # localhost URL. On a direct connection the flag only tells Prisma to
          # skip prepared statements, which is harmless.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # The payroll export's OTHER inputs — the company time zone and the Gusto
      # employee mappings. Those two reads used to go out on the GLOBAL prisma
      # client from inside the lock's transaction, so a zone or mapping edit
      # could land between them and the entry read and be hashed into a frozen
      # pay period. The fake-client test pins which client each read uses; only
      # this step shows PostgreSQL actually holds the writer off.
      - name: Prove the export's FOR SHARE blocks a zone or mapping change
        run: npx tsx --test tests/payroll-settings-lock-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Reaches the app's prisma singleton (saveGustoSettings) — same
          # pgbouncer reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # payType and hourlyRate are EXPORT INPUTS: pay type decides who is on the
      # Gusto file at all, and lockPayrollPeriod hashes the roster and freezes
      # it. Neither the export's roster read nor the rate writers held anything
      # against the other, so a pay type could change between the lock's
      # "confirmed" recompute and its COMMIT. The fake-client test pins which
      # lock is taken and in what order; only this step shows PostgreSQL
      # actually holds each side off.
      - name: Prove a pay-type change cannot land while a pay period is being locked
        run: npx tsx --test tests/payroll-paytype-lock-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Imports the app's prisma singleton via pay-rate-write — same
          # pgbouncer reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # ACTIVATION is the other half of the Gusto roster predicate
      # ("(ACTIVATED and HOURLY) or punched"), and no activation writer took the
      # payroll advisory lock — so a sign-in could add somebody to a pay
      # period's file between the lock's roster read and its COMMIT. The export
      # cannot defend itself there: FOR SHARE can only lock rows its own
      # predicate returned. The manifest test pins WHICH call sites are wrapped;
      # only this step shows PostgreSQL holds the writer off.
      - name: Prove an activation cannot land while a pay period is being locked
        run: npx tsx --test tests/payroll-activation-lock-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Reaches the app's prisma singleton through payroll-period — same
          # pgbouncer reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # A LOCKED period that has lost its frozen CSVs used to fall through to a
      # freshly recomputed LIVE csv — the one case where live data is definitely
      # the wrong answer, because the file was built from mutable inputs and
      # cannot be reproduced. Two defences, both proven here on a real database:
      # the CHECK constraint makes the row unrepresentable, and the endpoint
      # refuses (409) if one exists anyway.
      - name: Prove a locked period with no snapshot fails closed
        run: npx tsx --test tests/payroll-locked-snapshot-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Drives the real export endpoint, which reaches the app's prisma
          # singleton — same pgbouncer reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # WA meal settlement is a per-DAY rule, and every day key on that path used
      # to come from a helper hardcoded to America/Los_Angeles while the payroll
      # window around it used the CONFIGURED zone. For a non-Pacific company a
      # 00:30 Monday punch settled as a Pacific Sunday and the rule was computed
      # over two local days at once, which changes what comes off a paycheque.
      # Two zones, both boundaries, real rows, each with a pre-fix control.
      - name: Prove settlement uses the company time zone, not Pacific
        run: npx tsx --test tests/payroll-settlement-zone-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # settleDay reaches the app's prisma singleton — same pgbouncer
          # reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # A portal CLIENT account is not an employee. The rates panel, the CSV
      # importer, the rate writer and the export roster all used to ask only
      # whether an account was ACTIVATED, so a customer who had signed in once
      # could be given a pay type and then appear on every pay period's file.
      - name: Prove a customer account can never reach payroll
        run: npx tsx --test tests/payroll-staff-only-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # GET /api/time-entries served the whole Prisma model plus the owner as a
      # complete User row, so field crew received their own pinCode BCRYPT HASH
      # and pay rates, and a manager received everybody's. Real requests with
      # real mobile tokens, asserted as an allowlist.
      - name: Prove the time-entry response is an allowlist per audience
        run: npx tsx --test tests/time-entries-projection-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # Project.name and CostCode.code are columns of the detail CSV, so they are
      # inputs to the frozen hash - and neither row was held by anything, so a
      # rename could land between the export read and the lock COMMIT. Two real
      # connections, both renames, each with a pre-fix control.
      #
      # FOR SHARE holds off a rename, but not a DELETE that committed before it,
      # and TimeEntry.costCodeId is ON DELETE SET NULL - so the export re-reads
      # the entries' foreign keys under those locks and refuses if anything
      # moved or went missing. Staged on two connections at the exact instant
      # between the entry read and the locks, with the FK actions the reasoning
      # rests on asserted against the live catalog.
      - name: Prove a rename or a deletion cannot land while a period is frozen
        run: npx tsx --test tests/payroll-label-lock-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # PUT/PATCH /api/users/[id], PATCH /api/users and PATCH
      # /api/manager/employees/[id] all authorized against a User.role read
      # taken BEFORE the write transaction opened, then wrote without checking
      # again — an admin promotion committing in that gap let a manager's
      # already-in-flight request act on the now-admin account. Two real
      # connections: a promotion staged mid-transaction genuinely blocks the
      # guarded write on the row lock, and once it commits the write is
      # refused against the row it actually holds — for a status change, a
      # delete and a permission grant, each with an ADMIN control and a
      # pre-fix control reproducing the old vulnerable ordering verbatim.
      - name: Prove an admin promotion cannot land mid-flight under a manager's user write
        run: npx tsx --test tests/user-mutation-target-race-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # THE GLOBAL LOCK ORDER: payroll advisory lock, then the User row. The
      # guard decided whether to take the advisory lock from the Prisma `data`
      # payload alone, but the rate fields travel separately to the rate writer,
      # which takes the same lock itself — so a rate-only edit took the ROW
      # first and asked for the lock second, and deadlocked against a period
      # being locked. One predicate now answers for the whole request. Real
      # connections, both orders, an interleave staged at the exact instant the
      # old code deadlocked, and the inverted sequence written out beside it
      # showing PostgreSQL really does report 40P01. The same step covers the
      # apply script's payType seed, which now takes the shared lock and bumps
      # payrollRevision only for rows it actually changes.
      - name: Prove a rate edit and a period lock cannot invert the lock order
        run: npx tsx --test tests/payroll-lock-order-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Reaches the app's prisma singleton through payroll-period — same
          # pgbouncer reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # Round 12 locked the TARGET of a user mutation and re-read it inside the
      # transaction. The ACTOR was still taken from a query the route ran BEFORE
      # the transaction opened, so a manager demoted, disabled or stripped of
      # financialReports a millisecond earlier still wrote — and creation sat
      # outside the guard entirely. Both rows are now locked in ascending id
      # order and every check re-runs against them. Real connections, one case
      # per vector, a pre-fix control that wrongly succeeds, and a deadlock-
      # freedom case (two managers editing each other at once).
      - name: Prove a demoted or disabled actor cannot finish a user write
        run: npx tsx --test tests/user-mutation-actor-race-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Reaches the app's prisma singleton through payroll-period — same
          # pgbouncer reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # The same actor race, on the OTHER family of writers. Every payroll
      # mutation — the Gusto rate import, the pay-type change, the period lock,
      # the settle button, discard and unlock — authorized its caller and only
      # THEN opened a transaction that waits: on the payroll advisory lock, on
      # User rows, and in the settle button's case once per deferred day. An
      # account disabled, demoted or stripped of financialReports inside that
      # window still committed. requireFinancialActorInTx re-decides it under
      # the lock. Real connections, one case per vector, an ADMIN-only case,
      # a pre-fix control that wrongly succeeds, and deadlock freedom.
      - name: Prove a revoked payroll actor cannot finish a payroll write
        run: npx tsx --test tests/payroll-actor-reauth-db.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
          # Reaches the app's prisma singleton through payroll-period — same
          # pgbouncer reasoning as the rate-lock step above.
          DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations?pgbouncer=true

      # The DOCUMENTED deploy command, RUN. The PR body told Justin to export
      # PAYROLL_APPLY_EXPECT_PROJECT_REF while the script read
      # APPLY_EXPECT_PROJECT_REF, so the command in the deploy procedure could
      # not have succeeded and the refusal would have named the variable he was
      # looking at (round 16, finding 1). This parses the invocation out of the
      # script's own exported constant and runs it, with only `prod` swapped for
      # `ci`, so the documentation cannot drift away from something that works.
      - name: Prove the documented deploy command actually runs
        run: npx tsx --test tests/payroll-apply-target.test.ts
        env:
          PAYROLL_LOCK_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # THE SCRIPT ITSELF, run end to end — the one thing nothing else did.
      #
      # The parity test reads it as text, the drift tests import its pure
      # helpers, and the idempotency test runs it only against a database
      # `migrate deploy` has ALREADY brought to the final shape, which is the one
      # state where its whole DDL body is a no-op. So every statement that
      # actually CREATES something had never been executed by anything but
      # production. This builds the two states production has really been in —
      # pre-Phase-5, and the "accidentally applied on 2026-09-02" shape with
      # `payrollRevision` and the snapshot CHECK removed — and over each one:
      # apply, `--dry-run` must exit 0 with zero drift, apply again for
      # idempotency. `--target ci` takes the ambient URL, skips the production
      # baseline and project-ref checks, and REFUSES any Supabase host, so this
      # cannot reach a hosted database even by accident.
      #
      # Runs on its OWN database (probuild_apply_payroll) and last in the job, so
      # it cannot disturb the steps above.
      - name: Apply script end-to-end against real Postgres
        run: node scripts/ci-apply-payroll-phase5-e2e.mjs
        env:
          APPLY_E2E_SERVER_URL: postgresql://probuild:probuild@localhost:5432/postgres
          APPLY_E2E_DB: probuild_apply_payroll

      - name: Prove the blind-spot checker rejects function and trigger drift
        run: npx tsx --test tests/migration-history-blind-spots.test.ts
        env:
          MIGRATION_HISTORY_TEST_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations

      # THE APPLY SCRIPT, RUN THE WAY PRODUCTION RUNS IT.
      #
      # main() is the one part of that script nothing else executes — the unit
      # tests read its statement list and its guards as text — so a statement a
      # real Postgres rejects, or one in the wrong order, would ship green. The
      # driver builds a pre-Phase-2 database, seeds the rows the data-dependent
      # statements need (a legacy memo-signed issue, cards carrying a
      # deliveredOn claim), runs the script twice for idempotency, and asserts
      # the resulting shape — columns, indexes, RLS and policies — matches a
      # database built from the committed migration.
      - name: Apply script end-to-end against real Postgres
        run: node scripts/ci-apply-phase2-receipt-queue-e2e.mjs
        env:
          APPLY_E2E_SERVER_URL: postgresql://probuild:probuild@localhost:5432/postgres
          APPLY_E2E_DB: probuild_apply_phase2

  build:
    name: Build + Bundle Size
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint (non-blocking)
        run: npm run lint 2>&1 | tail -5 || true

      - name: Format check
        run: npx prettier --check . --ignore-unknown
        continue-on-error: true

      # Hermetic pure-logic suites — no DB, no network, so they belong in this job rather
      # than the Postgres one. CI ran neither of these before: tests/ was never wired up at
      # all, so the estimate money-math coverage added with PR #315 was gating nothing.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build 2>&1 | tee /tmp/build-output.txt
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://probuild-amber.vercel.app
          NEXT_PUBLIC_APP_URL: https://probuild-amber.vercel.app
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: golden-touch-remodeling

      - name: Bundle size report
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 100 "Route (app)" /tmp/build-output.txt | head -60 >> $GITHUB_STEP_SUMMARY || echo "No route output found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # E2E runs against a throwaway Postgres service container — NEVER the live
    # Supabase DB. (This job used to point at prod and filled /leads with QA
    # artifacts — see docs/TESTING.md.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: probuild
          POSTGRES_PASSWORD: probuild
          POSTGRES_DB: probuild_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # pgbouncer=true is required by src/lib/prisma.ts's URL check; on vanilla
      # Postgres it just disables prepared statements (harmless).
      DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_e2e?pgbouncer=true
      DIRECT_URL: postgresql://probuild:probuild@localhost:5432/probuild_e2e
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # SUPABASE_URL stays (it's non-secret TRUST config — the SSRF hostname
      # allowlist in secure-storage.ts and the attachment gate in
      # client-messages both key off its presence) but the service key is
      # deliberately gone: storage is hermetic here, like the DB.
      # E2E_STORAGE_MOCK routes getSupabase() to an in-memory stub
      # (src/lib/supabase-storage-mock.ts), so e2e never talks to the live
      # bucket and can't write objects into it. (The prod service key this
      # job used to get went stale when the key was rotated 2026-07-23, which
      # broke every storage-dependent spec with "signature verification
      # failed".)
      SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
      E2E_STORAGE_MOCK: "1"
      # Routes the selection AI features (ai-sort, decision-schedule-link) to
      # their deterministic mocks. Without it the specs hit the real Anthropic
      # API on every PR and the forced-failure test marker is inert prose.
      SELECTION_AI_MOCK: "1"
      # Routes getFreshQBTokens/buildQBPaymentRequest/sendQBPaymentCreateRequest
      # (src/lib/quickbooks.ts, quickbooks-payments.ts) to the deterministic,
      # no-network mock in src/lib/quickbooks-mock.ts. Real Intuit calls are
      # forbidden in CI; without this e2e/deposit-ingest.spec.ts's QBO-linked
      # cases would either hit the live API or fail with QBNotConnectedError
      # (no Integration row exists in the throwaway DB).
      E2E_QBO_MOCK: "1"
      # Shared secret for POST /api/payments/deposit-ingest's Bearer auth
      # (src/app/api/payments/deposit-ingest/route.ts). No external system
      # depends on this value — it only gates e2e/deposit-ingest.spec.ts
      # against the throwaway DB — so unlike the provider secrets above it's a
      # literal here rather than a repo secret (there's nothing to rotate).
      DEPOSIT_INGEST_SECRET: "e2e-ci-deposit-ingest-secret"

      # Shared secret for the Receipt Pipeline v2 intake endpoint
      # (src/app/api/receipts/intake/route.ts). Same reasoning as
      # DEPOSIT_INGEST_SECRET above: nothing external depends on this value, it
      # only gates e2e/receipt-intake.spec.ts against the throwaway DB, so it is
      # a literal rather than a repo secret. The spec's "env var unset" case is
      # a unit test (tests/receipt-intake-auth.test.ts), not this job.
      RECEIPT_INTAKE_SECRET: "e2e-ci-receipt-intake-secret"
      # The archive mirror's key is DELIBERATELY different — the specs assert
      # that cross-use between the two capabilities is a 403.
      RECEIPT_ARCHIVE_SECRET: "e2e-ci-receipt-archive-secret"
      # Beverly's Chat bridge key (Phase 2 §4) — a THIRD, distinct capability
      # from the two above (src/lib/receipt-intake/intake-auth.ts). Gates
      # /api/automation/receipt-requests/threads and .../answers; presenting
      # either other secret there is a 403, which is exactly what e2e/
      # receipt-requests.spec.ts's "bridge endpoints with the machine secret"
      # suite exercises, so it needs its OWN value here, not a reuse of
      # RECEIPT_INTAKE_SECRET.
      RECEIPT_BRIDGE_SECRET: "e2e-ci-receipt-bridge-secret"

      # The deposit sweep's live-apply switch (src/lib/deposit-sweep.ts). It is
      # OFF by default — booking money on an amount-only match is Justin's
      # decision, not a default — so the e2e cases that exercise the MONEY
      # WRITE need the server under test configured the way a live deployment
      # would be. Everything here runs against the throwaway CI database with
      # QuickBooks mocked (E2E_QBO_MOCK), so no real money can move.
      DEPOSIT_SWEEP_LIVE_APPLY: "true"

      # Forces the Stage A daily-log task matcher (daily-log-task-match.ts) onto
      # its deterministic keyword fallback instead of calling Gemini, so
      # time-suggestion.spec.ts's Stage A end-to-end test is reproducible in CI.
      DAILY_LOG_MATCH_AI_MOCK: "1"
      # Disables the post-save cost-code auto-assigner (lib/auto-assign-phases.ts). ANTHROPIC_API_KEY
      # IS supplied below, so without this the real classifier fires on every estimate save in the
      # suite and races estimate-cost-code-catchup.spec.ts, which simulates the assignment with a
      # direct DB write — flaky results plus real API spend on every PR.
      AUTO_ASSIGN_PHASES_AI_MOCK: "1"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: golden-touch-remodeling
      PLAYWRIGHT_TEST_SECRET: ${{ secrets.PLAYWRIGHT_TEST_SECRET }}
      # Explicit opt-in for src/app/api/test-only/contract-actions (and the
      # src/proxy.ts bypass it needs): the dispatcher e2e/contract-auth-runtime.spec.ts
      # calls to exercise the contract guards behaviorally. Deliberately set ONLY
      # in this job — a secret leaking into an environment must not silently turn
      # the route on, so "test routes are enabled" is its own positive decision,
      # not a side effect of PLAYWRIGHT_TEST_SECRET being present. Without it the
      # dispatcher 404s and the spec fails loudly instead of silently passing
      # against a route that never ran.
      E2E_TEST_ROUTES: "1"
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create schema in throwaway Postgres
        run: npx prisma db push --skip-generate

      # DepositIngest's reservation index (stops two deposit files from
      # claiming the same pending milestone — see the model's doc comment in
      # prisma/schema.prisma) is a partial unique index, which Prisma cannot
      # express and `db push` therefore never creates. e2e/deposit-ingest.spec.ts's
      # reservation-blocking cases need it for real, so apply it here exactly
      # like a prod deploy would (scripts/apply-deposit-ingest-schema.mjs is
      # additive/idempotent — safe to run against the fresh throwaway DB).
      - name: Apply DepositIngest reservation index
        run: node scripts/apply-deposit-ingest-schema.mjs

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # These assert invariants nothing else does: money lock ordering, portal
      # visibility, dispatch publication, evidence classification. CI never ran
      # them before, and one had been failing unnoticed since PR #273 renamed a
      # file it asserts on. Runs here because this job already has a throwaway
      # Postgres with the schema pushed, so the DB-backed suites can execute for
      # real instead of tripping their production guard.
      - name: Run verify suites
        run: node scripts/run-verify-all.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Post results summary
        if: always()
        run: |
          echo "## Playwright E2E Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** localhost:3000 (production build)" >> $GITHUB_STEP_SUMMARY
          echo "**Database:** throwaway Postgres service container (no live data)" >> $GITHUB_STEP_SUMMARY
