name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Proves that prisma/migrations/ still reproduces PRODUCTION's schema. Before
  # the 2026-08-14 baseline, prisma/migrations/ and prod's _prisma_migrations had
  # no common ancestor at all: the folder held one never-applied 3-line file, and
  # nothing in CI or the deploy path ever ran `migrate deploy`, so a database
  # built from the committed migrations bore no relation to prod.
  #
  # Runs against a throwaway Postgres service container — NEVER the live DB.
  migrations:
    name: Migrations reproduce production
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: probuild
          POSTGRES_PASSWORD: probuild
          POSTGRES_DB: probuild_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
      DIRECT_URL: postgresql://probuild:probuild@localhost:5432/probuild_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # `npm ci`, not `npm install`: this job's whole purpose is byte-level
      # reproducibility, so the toolchain that renders DDL has to come from the
      # lockfile rather than being free to resolve a different engine build.
      - run: npm ci

      # Executes the baseline for real. Nothing had ever run this SQL before it
      # was committed, so this step alone is the difference between a baseline
      # that is known-good and one that merely looks right.
      - name: Apply committed migrations to the throwaway database
        run: npx prisma migrate deploy

      - name: Assert the result matches production's shape
        run: node scripts/check-migrations-match.mjs

      # prisma/EXPECTED_SCHEMA_GAP.sql is intended to become the NEXT migration,
      # so its executability is part of its contract. Running it here catches the
      # class of error that would otherwise only surface against production —
      # e.g. an index whose name the baseline already used.
      - name: Apply the recorded schema gap
        run: npx prisma db execute --file prisma/EXPECTED_SCHEMA_GAP.sql --schema prisma/schema.prisma

      - name: Assert the gap actually closes the gap
        run: node scripts/check-migrations-match.mjs --gap-applied

  build:
    name: Build + Bundle Size
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint (non-blocking)
        run: npm run lint 2>&1 | tail -5 || true

      - name: Format check
        run: npx prettier --check . --ignore-unknown
        continue-on-error: true

      # Hermetic pure-logic suites — no DB, no network, so they belong in this job rather
      # than the Postgres one. CI ran neither of these before: tests/ was never wired up at
      # all, so the estimate money-math coverage added with PR #315 was gating nothing.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build 2>&1 | tee /tmp/build-output.txt
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://probuild-amber.vercel.app
          NEXT_PUBLIC_APP_URL: https://probuild-amber.vercel.app
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: golden-touch-remodeling

      - name: Bundle size report
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 100 "Route (app)" /tmp/build-output.txt | head -60 >> $GITHUB_STEP_SUMMARY || echo "No route output found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # E2E runs against a throwaway Postgres service container — NEVER the live
    # Supabase DB. (This job used to point at prod and filled /leads with QA
    # artifacts — see docs/TESTING.md.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: probuild
          POSTGRES_PASSWORD: probuild
          POSTGRES_DB: probuild_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # pgbouncer=true is required by src/lib/prisma.ts's URL check; on vanilla
      # Postgres it just disables prepared statements (harmless).
      DATABASE_URL: postgresql://probuild:probuild@localhost:5432/probuild_e2e?pgbouncer=true
      DIRECT_URL: postgresql://probuild:probuild@localhost:5432/probuild_e2e
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # SUPABASE_URL stays (it's non-secret TRUST config — the SSRF hostname
      # allowlist in secure-storage.ts and the attachment gate in
      # client-messages both key off its presence) but the service key is
      # deliberately gone: storage is hermetic here, like the DB.
      # E2E_STORAGE_MOCK routes getSupabase() to an in-memory stub
      # (src/lib/supabase-storage-mock.ts), so e2e never talks to the live
      # bucket and can't write objects into it. (The prod service key this
      # job used to get went stale when the key was rotated 2026-07-23, which
      # broke every storage-dependent spec with "signature verification
      # failed".)
      SUPABASE_URL: https://ghzdbzdnwjxazvmcefbh.supabase.co
      E2E_STORAGE_MOCK: "1"
      # Routes the selection AI features (ai-sort, decision-schedule-link) to
      # their deterministic mocks. Without it the specs hit the real Anthropic
      # API on every PR and the forced-failure test marker is inert prose.
      SELECTION_AI_MOCK: "1"
      # Routes getFreshQBTokens/buildQBPaymentRequest/sendQBPaymentCreateRequest
      # (src/lib/quickbooks.ts, quickbooks-payments.ts) to the deterministic,
      # no-network mock in src/lib/quickbooks-mock.ts. Real Intuit calls are
      # forbidden in CI; without this e2e/deposit-ingest.spec.ts's QBO-linked
      # cases would either hit the live API or fail with QBNotConnectedError
      # (no Integration row exists in the throwaway DB).
      E2E_QBO_MOCK: "1"
      # Shared secret for POST /api/payments/deposit-ingest's Bearer auth
      # (src/app/api/payments/deposit-ingest/route.ts). No external system
      # depends on this value — it only gates e2e/deposit-ingest.spec.ts
      # against the throwaway DB — so unlike the provider secrets above it's a
      # literal here rather than a repo secret (there's nothing to rotate).
      DEPOSIT_INGEST_SECRET: "e2e-ci-deposit-ingest-secret"
      # Forces the Stage A daily-log task matcher (daily-log-task-match.ts) onto
      # its deterministic keyword fallback instead of calling Gemini, so
      # time-suggestion.spec.ts's Stage A end-to-end test is reproducible in CI.
      DAILY_LOG_MATCH_AI_MOCK: "1"
      # Disables the post-save cost-code auto-assigner (lib/auto-assign-phases.ts). ANTHROPIC_API_KEY
      # IS supplied below, so without this the real classifier fires on every estimate save in the
      # suite and races estimate-cost-code-catchup.spec.ts, which simulates the assignment with a
      # direct DB write — flaky results plus real API spend on every PR.
      AUTO_ASSIGN_PHASES_AI_MOCK: "1"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: golden-touch-remodeling
      PLAYWRIGHT_TEST_SECRET: ${{ secrets.PLAYWRIGHT_TEST_SECRET }}
      # Explicit opt-in for src/app/api/test-only/contract-actions (and the
      # src/proxy.ts bypass it needs): the dispatcher e2e/contract-auth-runtime.spec.ts
      # calls to exercise the contract guards behaviorally. Deliberately set ONLY
      # in this job — a secret leaking into an environment must not silently turn
      # the route on, so "test routes are enabled" is its own positive decision,
      # not a side effect of PLAYWRIGHT_TEST_SECRET being present. Without it the
      # dispatcher 404s and the spec fails loudly instead of silently passing
      # against a route that never ran.
      E2E_TEST_ROUTES: "1"
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create schema in throwaway Postgres
        run: npx prisma db push --skip-generate

      # DepositIngest's reservation index (stops two deposit files from
      # claiming the same pending milestone — see the model's doc comment in
      # prisma/schema.prisma) is a partial unique index, which Prisma cannot
      # express and `db push` therefore never creates. e2e/deposit-ingest.spec.ts's
      # reservation-blocking cases need it for real, so apply it here exactly
      # like a prod deploy would (scripts/apply-deposit-ingest-schema.mjs is
      # additive/idempotent — safe to run against the fresh throwaway DB).
      - name: Apply DepositIngest reservation index
        run: node scripts/apply-deposit-ingest-schema.mjs

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # These assert invariants nothing else does: money lock ordering, portal
      # visibility, dispatch publication, evidence classification. CI never ran
      # them before, and one had been failing unnoticed since PR #273 renamed a
      # file it asserts on. Runs here because this job already has a throwaway
      # Postgres with the schema pushed, so the DB-backed suites can execute for
      # real instead of tripping their production guard.
      - name: Run verify suites
        run: node scripts/run-verify-all.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Post results summary
        if: always()
        run: |
          echo "## Playwright E2E Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** localhost:3000 (production build)" >> $GITHUB_STEP_SUMMARY
          echo "**Database:** throwaway Postgres service container (no live data)" >> $GITHUB_STEP_SUMMARY
